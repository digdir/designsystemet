name: Azure Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    if: ${{ github.repository == 'digdir/designsystemet' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: az login (oidc)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete preview Container Apps
        env:
          PR_NUMBER: ${{ github.event.number }}
          RESOURCE_GROUP: rg-designsystemet-test
          # Base names of preview apps we want to clean up. Add/remove as needed.
          PREVIEW_APPS: www themebuilder storybook
        run: bash ./.github/workflows/scripts/delete-preview-apps.sh
