name: Preview Comment
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
        description: 'PR number for the comment'
      deployment_type:
        required: true
        type: string
        description: 'Type of deployment (www, theme, storybook)'
      deployment_url:
        required: true
        type: string
        description: 'The deployment URL'

permissions:
  contents: read
  pull-requests: write

jobs:
  update-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find Preview Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ inputs.pr_number }}
          body-includes: |
            **Preview deployments for this pull request:**

      - name: Find Storybook deployment
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-storybook
        with:
          text: ${{ steps.fc.outputs.comment-body }}
          regex: '(\[storybook\]\([^)]+\)[^\n]*)'

      - name: Find Theme deployment
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-theme
        with:
          text: ${{ steps.fc.outputs.comment-body }}
          regex: '(\[themebuilder\]\([^)]+\)[^\n]*)'

      - name: Find www deployment
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-www
        with:
          text: ${{ steps.fc.outputs.comment-body }}
          regex: '(\[www\]\([^)]+\)[^\n]*)'

      - name: Get current time in CEST
        uses: josStorer/get-current-time@6826799222c9d913068c04cb99e67f34dbf3caae # v2.1.3
        id: current-time
        with:
          format: D. MMM YYYY - HH:mm
          timezone: Europe/Oslo

      - name: Set deployment links
        id: links
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          FORMATTED_TIME: ${{ steps.current-time.outputs.formattedTime }}
          STORYBOOK_EXISTING: ${{ steps.regex-storybook.outputs.match }}
          THEME_EXISTING: ${{ steps.regex-theme.outputs.match }}
          WWW_EXISTING: ${{ steps.regex-www.outputs.match }}
        run: bash ./.github/workflows/scripts/preview-comment-links.sh

      - name: Update comment with deployment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ inputs.pr_number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.links.outputs.body }}
