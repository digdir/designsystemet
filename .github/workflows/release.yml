name: Release

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Create snapshot release"
        type: boolean
        default: true
      tag:
        description: "npm tag (for snapshot releases)"
        type: choice
        default: "test"
        options:
          - next
          - test
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gh-setup
      - name: Build
        run: pnpm build
      - name: Install ## running install again for designsystemt bin to be registered
        run: pnpm install --frozen-lockfile
        shell: bash
      - id: snapshot
        name: Set Snapshot Name
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash ./.github/workflows/scripts/set-snapshot-name.sh
      - id: publish
        name: Create Snapshot Release
        run: bash ./.github/workflows/scripts/create-snapshot-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""
          SNAPSHOT_NAME: ${{ steps.snapshot.outputs.name }}
          TAG: ${{ github.event.inputs.tag }}
      - name: Comment published packages on PR
        if: ${{ steps.publish.outputs.packages != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ github.event.inputs.tag }}
          PACKAGES: ${{ steps.publish.outputs.packages }}
        run: bash ./.github/workflows/scripts/snapshot-release-comment.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.snapshot != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gh-setup
      - name: Build Designsystemet CLI
        run: pnpm build:types && pnpm build:cli
      - name: Install ## running install again for designsystemt bin to be registered
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: Store release version for changeset
        id: release_version
        run: echo "VALUE=$(bash ./scripts/print_release_version.sh)" >> $GITHUB_OUTPUT
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm publish-packages
          version-script: pnpm version-packages
          commit-message: "chore: new release"
          pr-title: "chore: new release"
          # We create one aggregated release + tag (vX.Y.Z) ourselves below
          # instead of one release/tag per package.
          create-github-releases: false
          push-git-tags: false
      - name: Create aggregated GitHub release
        if: ${{ steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.release_version.outputs.value }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: bash ./.github/workflows/scripts/create-aggregated-release.sh

  deploy-www:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/azure-deploy-www.yml
    with:
      environment: "production"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SLACK_INVITE_URL: ${{ secrets.SLACK_INVITE_URL }}
  deploy-theme:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/azure-deploy-themebuilder.yml
    with:
      environment: "production"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  deploy-storybook:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/azure-deploy-storybook.yml
    with:
      environment: "production"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
