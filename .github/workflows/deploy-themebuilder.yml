name: Deploy themebuilder
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: next
        description: Deploy to environment
        options:
          - production
          - next

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-production:
    uses: $/.github/workflows/azure-deploy-themebuilder.yml
    with:
      environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
      database_identity: ${{ vars[github.event.inputs.environment == 'production' && 'THEMEBUILDER_DATABASE_IDENTITY' || 'THEMEBUILDER_PREVIEW_DATABASE_IDENTITY'] }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # `next` is a preview, and only has a database when the previews are given one.
      # The name is picked first, so that production never falls back to the database of the previews.
      THEMEBUILDER_DATABASE_URL: ${{ secrets[github.event.inputs.environment == 'production' && 'THEMEBUILDER_DATABASE_URL' || 'THEMEBUILDER_PREVIEW_DATABASE_URL'] }}
