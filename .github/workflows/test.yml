name: Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - "packages/**"
      - "apps/storybook/**"
      - "figma/**"
      # Dependency updates can break tests without touching any package files
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  # main gets a push run so a breakage that slips through shows up right away
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - "packages/**"
      - "apps/storybook/**"
      - "figma/**"
      # Dependency updates can break tests without touching any package files
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/storybook/package.json
          sparse-checkout-cone-mode: false

      # The test job's container image must match this version exactly, as it holds the browser builds for it
      - name: Read Playwright version
        id: version
        run: |
          version="$(jq -r '.devDependencies.playwright' apps/storybook/package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an exact Playwright version in apps/storybook/package.json, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Build & test
    needs: playwright-version
    permissions:
      contents: read
    # The container below decides the OS, so the runner can be any Linux
    runs-on: ubuntu-latest
    # A stuck run fails instead of blocking the PR. A normal run takes about 5-10 minutes.
    timeout-minutes: 30
    # Playwright's image has the browsers and their system dependencies installed, so no slow apt install is needed.
    # https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # --user 1001: Firefox refuses to run as root in GitHub's home directory.
      # --ipc=host: Chromium can run out of shared memory with Docker's default /dev/shm.
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/gh-setup

      - name: Build
        run: pnpm build
      - name: Types
        run: pnpm types:react
      - name: Test Web
        run: pnpm test:web
      - name: Run Storybook tests
        run: pnpm --filter @web/storybook vitest
      - name: Test
        run: pnpm test
      - name: Test CLI (create tokens, then build the theme)
        run: pnpm test:cli
