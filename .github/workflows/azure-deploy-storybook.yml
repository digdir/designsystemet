name: azure deploy storybook
run-name: Deploy to storybook to ${{ inputs.environment }} by @${{ github.actor }}
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Deployment environment (production, preview)'
      pr_number:
        required: false
        type: string
        description: 'PR number for preview deployments'
      update_comment:
        required: false
        type: boolean
        default: false
        description: 'Whether to update PR comment with deployment URL'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: azure-storybook-prod-deploy-${{ inputs.environment == 'production' && 'production' || inputs.pr_number || 'preview' }}
  cancel-in-progress: true

env:
  RESOURCE_GROUP: ${{ inputs.environment == 'production' && 'rg-designsystemet-prod' || 'rg-designsystemet-test' }}
  CONTAINERAPPS_ENV: ${{ inputs.environment == 'production' && 'storybook-prod-ca' || 'storybook-test-ca' }}
  ACR_NAME: designsystemetacr
  APP_NAME: ${{ inputs.environment == 'production' && 'storybook-prod' || format('storybook-pr-{0}', inputs.pr_number) }}
  IMAGE: ${{ inputs.pr_number && format('{0}-{1}', inputs.pr_number, github.sha) || format('{0}-{1}', github.run_id, github.sha) }}
  PORT: 6006

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      fqdn: ${{ steps.fqdn.outputs.fqdn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: az login (oidc)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: acr login (for docker push)
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: storybook
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/storybook:${{ env.IMAGE }}
          build-args: |
            PORT=${{ env.PORT }}
            HOST=0.0.0.0
            APP_ENV=${{ inputs.environment }}

      - name: get acr creds (masked)
        id: acr
        shell: bash
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: bash ./.github/workflows/scripts/get-acr-creds.sh

      - name: deploy (no mi; use registry creds)
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINERAPPS_ENV }}
          containerAppName: ${{ env.APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/storybook:${{ env.IMAGE }}
          registryUrl: ${{ env.ACR_NAME }}.azurecr.io
          registryUsername: ${{ steps.acr.outputs.user }}
          registryPassword: ${{ steps.acr.outputs.pass }}
          targetPort: ${{ env.PORT }}
          ingress: external
          environmentVariables: "PORT=${{ env.PORT }} HOST=0.0.0.0 APP_ENV=${{ inputs.environment }}"
          location: "norwayeast"

      - name: fetch fqdn
        id: fqdn
        env:
          APP_NAME: ${{ env.APP_NAME }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
        run: bash ./.github/workflows/scripts/get-containerapp-fqdn.sh

  update-comment:
    if: ${{ inputs.update_comment }}
    needs: deploy
    uses: $/.github/workflows/preview-comment.yml
    with:
      pr_number: ${{ github.event.number }}
      deployment_type: storybook
      deployment_url: https://${{ needs.deploy.outputs.fqdn }}
