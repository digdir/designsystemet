name: Check .github
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  actions:
    name: Lint, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gh-setup
      - name: Biome
        run: pnpm biome ci .github
      - name: Unit tests
        run: node --test ".github/actions/**/*.test.mjs"
