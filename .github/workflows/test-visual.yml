name: Visual tests

on:
  # pr runs ONLY when the pr is in review, and on new pushes to that pr
  pull_request:
    branches: [main, next]
    types: [opened, ready_for_review, synchronize, reopened]
    paths:
      - .github/workflows/test-visual.yml
      - "packages/**/*.tsx?"
      - "packages/**/*.css"
      - "packages/**/package.json"
      - "packages/**/*.stories.tsx?"
      - "apps/storybook/**"
      - "design-tokens/**/*.jsonc?"

  # main gets a push run so chromatic can auto-accept baselines there
  push:
    branches: [main]
    paths:
      - "packages/**/*.tsx?"
      - "packages/**/*.css"
      - "packages/**/package.json"
      - "packages/**/*.stories.tsx?"
      - "apps/storybook/**"
      - "design-tokens/**/*.jsonc?"
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  pr-visual-tests:
    concurrency:
      group: visual-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # build the PR HEAD exactly
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/gh-setup
      - name: Build
        run: pnpm build
      - name: Build storybook
        run: pnpm build:storybook
      - name: Chromatic (visual + interaction)
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          workingDir: apps/storybook
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: true

  main-visual-tests:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gh-setup
      - name: Build
        run: pnpm build
      - name: Build storybook
        run: pnpm build:storybook
      - name: Chromatic (auto-accept on main)
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          workingDir: apps/storybook
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: true
          onlyChanged: true
