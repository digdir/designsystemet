name: Checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "figma/**"
      - "changelog.json"
      # The changelog check reads which packages are not versioned from it
      - ".changeset/config.json"
      - "scripts/**"
      - "biome.jsonc"
      # Dependency updates can break the build and types without touching any package files
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/gh-setup
      - name: Build
        run: pnpm build
      - name: Types
        run: pnpm types
      # It can be edited by hand, e.g. in the release PR
      - name: Check changelog.json
        run: node scripts/group-changelogs.js --check
      - name: Biome CI
        run: pnpm biome ci .
