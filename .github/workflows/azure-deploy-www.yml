name: azure deploy www
run-name: Deploy to www to ${{ inputs.environment }} by @${{ github.actor }}
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (production, preview)"
      documentation_version:
        required: false
        type: string
        description: "Archived major version (e.g. v1); only for manual production deployments"
      pr_number:
        required: false
        type: string
        description: "PR number for preview deployments"
      update_comment:
        required: false
        type: boolean
        default: false
        description: "Whether to update PR comment with deployment URL"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SLACK_INVITE_URL:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: azure-www-prod-deploy-${{ inputs.documentation_version || (inputs.environment == 'production' && 'production' || inputs.pr_number || 'preview') }}
  cancel-in-progress: true

env:
  RESOURCE_GROUP: ${{ inputs.environment == 'production' && 'rg-designsystemet-prod' || 'rg-designsystemet-test' }}
  CONTAINERAPPS_ENV: ${{ inputs.environment == 'production' && 'www-prod-ca' || 'www-test-ca' }}
  ACR_NAME: designsystemetacr
  APP_NAME: ${{ inputs.documentation_version && format('www-{0}', inputs.documentation_version) || (inputs.environment == 'production' && 'www-prod' || format('www-pr-{0}', inputs.pr_number)) }}
  IMAGE: ${{ inputs.documentation_version && format('{0}-{1}-{2}', inputs.documentation_version, github.run_id, github.sha) || (inputs.pr_number && format('{0}-{1}', inputs.pr_number, github.sha) || format('{0}-{1}', github.run_id, github.sha)) }}
  DOCUMENTATION_VERSION: ${{ inputs.documentation_version }}
  PORT: 8000

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      fqdn: ${{ steps.fqdn.outputs.fqdn }}
    steps:
      - name: Validate documentation version
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$DOCUMENTATION_VERSION" ]]; then
            if [[ ! "$DOCUMENTATION_VERSION" =~ ^v[1-9][0-9]*$ ]]; then
              echo "::error::Documentation version must be a major version such as v1 or v2."
              exit 1
            fi
            if [[ "$DEPLOYMENT_ENVIRONMENT" != "production" || "$DEPLOYMENT_EVENT" != "workflow_dispatch" ]]; then
              echo "::error::Archived documentation requires a manual production deployment."
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest changelog version is left undated by the release PR (its release does not exist
      # yet); date it from the GitHub release before the content is copied into the image.
      - name: Date the latest changelog entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/date-latest-changelog.js

      - name: az login (oidc)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: acr login (for docker push)
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: www
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/www:${{ env.IMAGE }}
          build-args: |
            PORT=${{ env.PORT }}
            HOST=0.0.0.0
            APP_ENV=${{ inputs.environment }}
            DOCUMENTATION_VERSION=${{ env.DOCUMENTATION_VERSION }}

      - name: get acr creds (masked)
        id: acr
        shell: bash
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: bash ./.github/workflows/scripts/get-acr-creds.sh

      - name: deploy (no mi; use registry creds)
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2.x
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINERAPPS_ENV }}
          containerAppName: ${{ env.APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/www:${{ env.IMAGE }}
          registryUrl: ${{ env.ACR_NAME }}.azurecr.io
          registryUsername: ${{ steps.acr.outputs.user }}
          registryPassword: ${{ steps.acr.outputs.pass }}
          targetPort: ${{ env.PORT }}
          ingress: external
          environmentVariables: "PORT=${{ env.PORT }} HOST=0.0.0.0 APP_ENV=${{ inputs.environment }} SLACK_INVITE_URL=${{ secrets.SLACK_INVITE_URL }} DOCUMENTATION_VERSION=${{ env.DOCUMENTATION_VERSION }}"
          location: "norwayeast"

      - name: fetch fqdn
        id: fqdn
        env:
          APP_NAME: ${{ env.APP_NAME }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
        run: bash ./.github/workflows/scripts/get-containerapp-fqdn.sh

  update-comment:
    if: ${{ inputs.update_comment }}
    needs: deploy
    uses: $/.github/workflows/preview-comment.yml
    with:
      pr_number: ${{ github.event.number }}
      deployment_type: www
      deployment_url: https://${{ needs.deploy.outputs.fqdn }}
