name: check cli node compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "design-tokens/**"
      - "packages/cli/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/check-cli-node-compatibility.yml"
      - ".github/workflows/scripts/remove-pnpm-node-pin.sh"

permissions:
  contents: read

jobs:
  build:
    name: build (workspace node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no setup-node here; let pnpm's useNodeVersion rule
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }

      - name: install (workspace node via useNodeVersion)
        run: pnpm install

      - name: build cli
        run: pnpm --filter "@digdir/designsystemet..." build

      - name: upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: packages/cli/dist

  test:
    name: node ${{ matrix.node }} • cli
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 23.x, 24.x, 25.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: neuter pnpm node pin
        run: bash ./.github/workflows/scripts/remove-pnpm-node-pin.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { run_install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: print versions
        run: |
          node -v
          pnpm -v

      - name: install deps for this node
        run: pnpm install
        env:
          PNPM_CONFIG_ENGINE_STRICT: "false"

      - name: fetch built dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: packages/cli/dist

      - name: test cli (built dist bin)
        run: pnpm --filter "@digdir/designsystemet" test
        env:
          DESIGNSYSTEMET_BIN: ./dist/bin/designsystemet.js
