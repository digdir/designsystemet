name: Deploy www
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: next
        description: Deploy to environment
        options:
          - production
          - next
      documentation_version:
        type: string
        required: false
        description: "Archived major version (e.g. v1); select production. Leave empty for the current site."

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-production:
    uses: $/.github/workflows/azure-deploy-www.yml
    with:
      environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
      documentation_version: ${{ inputs.documentation_version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      SLACK_INVITE_URL: ${{ secrets.SLACK_INVITE_URL }}
