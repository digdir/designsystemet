name: azure preview themebuilder
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/themebuilder/**"
      - "internal/components/**"
      - ".github/workflows/azure-preview-themebuilder.yml"
      - ".github/workflows/azure-deploy-themebuilder.yml"
      - ".github/workflows/preview-comment.yml"
      - ".github/workflows/scripts/get-acr-creds.sh"
      - ".github/workflows/scripts/get-containerapp-fqdn.sh"
      - ".github/workflows/scripts/preview-comment-links.sh"
      - ".github/workflows/scripts/set-containerapp-database-secret.sh"
      - "Dockerfile"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: $/.github/workflows/azure-deploy-themebuilder.yml
    with:
      environment: preview
      pr_number: ${{ github.event.number }}
      update_comment: true
      database_identity: ${{ vars.THEMEBUILDER_PREVIEW_DATABASE_IDENTITY }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Previews have no database, and themes cannot be shared in them. To try a change to the database,
      # set this secret to the URL of a test database for a while. Never the production database.
      THEMEBUILDER_DATABASE_URL: ${{ secrets.THEMEBUILDER_PREVIEW_DATABASE_URL }}
