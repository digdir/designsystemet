# Runs conventional commit check on PR
name: Conventional pull request
on:
  pull_request:
    branches:
      - main
      - next
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/conventional-pr
        with:
          ignore-commits: "true"
