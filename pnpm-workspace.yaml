packages:
  - packages/*
  - apps/*
  - figma/*
  - internal/*
  - test/*
allowBuilds:
  "@biomejs/biome": true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  rs-module-lexer: true
  style-dictionary: true
blockExoticSubdeps: true
injectWorkspacePackages: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@u-elements/*"
  # Renovate security update: @storybook/addon-vitest@10.6.2
  - "@storybook/addon-vitest@10.6.2"
packageExtensions:
  "@navikt/aksel-icons":
    peerDependencies:
      react: ">=18.3.1 || ^19.0.0"
    peerDependenciesMeta:
      react:
        optional: true
syncInjectedDepsAfterScripts:
  - build
  - build:all
  - build:www
  - build:themebuilder
  - build:storybook
nodeVersion: "24.19.0"
patchedDependencies:
  '@u-elements/u-combobox': patches/@u-elements__u-combobox.patch
